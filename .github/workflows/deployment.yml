name: Deployment

on:
  workflow_dispatch:
  push:
    branches: ["deployment"]

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Site
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install mdBook
        run: cargo install mdbook --no-default-features

      - name: Build app (Trunk)
        run: |
          rm -rf site
          make release DIST_DIR=site PUBLIC_URL="${{ steps.pages.outputs.base_url }}/"

      - name: Package circuits source bundle
        run: sh deployments/scripts/package-circuits-source-bundle.sh site/circuits/source-bundle.tar.gz

      - name: Resolve symlinks in docs
        run: |
          cd docs/src
          for f in *.md; do
            if [ -L "$f" ]; then
              cp --remove-destination "$(readlink -f "$f")" "$f"
            fi
          done

      - name: Copy assets into docs source
        run: cp -r assets docs/src/assets

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.pages.outputs.base_url }}/docs/
        run: mdbook build docs/

      - name: Build API documentation
        run: cargo doc --no-deps --workspace

      - name: Combine outputs
        run: |
          rm -f target/doc/.lock
          mkdir -p site/docs/api
          cp -r docs/book/* site/docs/
          cp -r target/doc/* site/docs/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Deploy the app and publish docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
